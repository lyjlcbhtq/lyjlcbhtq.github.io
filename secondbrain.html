    <script>
      // M6.1 首屏无闪烁:React 挂载前先定主题(与 client/src/lib/theme.ts 同一套键值与回退逻辑)
      (function () {
        try {
          var t = localStorage.getItem("secondbrain:theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          /* 存储不可用时保持默认亮色 */
        }
      })();
    </script>
